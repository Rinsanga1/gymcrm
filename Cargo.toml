[package]
name = "tenne_crm"
version = "0.1.0"
edition = "2021"
description = "TenneCRM - gym CRM for Windows"

[[bin]]
name = "tenne_crm"
path = "src/main.rs"

[dependencies]
eframe = "0.34"
egui_extras = "0.34"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
csv = "1.3"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
